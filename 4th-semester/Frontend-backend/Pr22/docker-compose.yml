version: '3.8'

services:
  backend1:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
    command: sh -c "npm install && node server.js"
    environment:
      - SERVER_NAME=Backend-1
      - PORT=3000

  backend2:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
    command: sh -c "npm install && node server.js"
    environment:
      - SERVER_NAME=Backend-2
      - PORT=3000

  backend_backup:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
    command: sh -c "npm install && node server.js"
    environment:
      - SERVER_NAME=Backend-Backup
      - PORT=3000

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend1
      - backend2
      - backend_backup

  haproxy:
    image: haproxy:alpine
    ports:
      - "8080:80"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      - backend1
      - backend2
      - backend_backup